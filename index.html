<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>匿名评分榜</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>匿名评分榜</h1>
      <p>学生匿名评分 · 0-10分 · 实时排行榜</p>
    </div>
    <button id="adminBtn">管理员</button>
  </header>

  <main class="container">
    <section class="search-card">
      <input id="searchInput" placeholder="搜索人物名称" />
      <div class="tabs">
        <button class="tab active" data-major="all">全部</button>
        <button class="tab" data-major="计算机">计算机</button>
        <button class="tab" data-major="商科">商科</button>
      </div>
    </section>

    <section id="rankingList" class="ranking-list"></section>

    <section id="adminPanel" class="admin-panel hidden">
      <h2>管理员后台</h2>
      <div id="loginBox">
        <input id="adminEmail" placeholder="管理员邮箱" />
        <input id="adminPassword" type="password" placeholder="密码" />
        <button id="loginBtn">登录</button>
      </div>

      <div id="manageBox" class="hidden">
        <p id="adminStatus"></p>
        <input id="newName" placeholder="人物名称" />
        <select id="newMajor">
          <option value="计算机">计算机</option>
          <option value="商科">商科</option>
        </select>
        <button id="addPersonBtn">添加人物</button>
        <button id="logoutBtn" class="danger">退出登录</button>
      </div>
    </section>
  </main>

  <div id="detailModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close">×</button>
      <h2 id="modalName"></h2>
      <p id="modalMajor"></p>
      <div class="score-big" id="modalScore"></div>
      <p id="modalCount"></p>
      <label>选择你的评分：<span id="scoreValue">10</span> 分</label>
      <input id="scoreRange" type="range" min="0" max="10" step="0.5" value="10" />
      <button id="submitScoreBtn">提交评分</button>
      <p id="ratingMsg"></p>
    </div>
  </div>

 <footer class="footer-note">
  本平台旨在促进同学之间的良性互动与交流，请文明发言、理性评分，共同维护健康友善的校园网络环境。
</footer>
</body>
</html>
